server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  # Security headers. Adjust connect-src to your Supabase URL.
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;
  add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self)" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob: data:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' blob: https://*.supabase.co wss://*.supabase.co http://localhost:54321 ws://localhost:54321; worker-src 'self'; frame-ancestors 'none'" always;

  location = /sw.js { add_header Cache-Control "no-cache"; }
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
  location / { try_files $uri /index.html; }
}
