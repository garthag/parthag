# Edge reverse proxy: serves the SPA and routes /api to the FastAPI backend.
upstream api_upstream {
    server api:8000;
    keepalive 32;
}
upstream web_upstream {
    server web:80;
}

limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

server {
    listen 80;
    server_name _;

    client_max_body_size 1024m;      # folder / zip uploads of 1000+ drawings
    client_body_timeout 600s;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://api_upstream;
        include /etc/nginx/proxy_params.conf;
    }

    location /api/ {
        proxy_pass http://api_upstream;
        proxy_request_buffering off;
        include /etc/nginx/proxy_params.conf;
    }

    location = /health { proxy_pass http://api_upstream; include /etc/nginx/proxy_params.conf; }

    location / {
        proxy_pass http://web_upstream;
        include /etc/nginx/proxy_params.conf;
    }
}
