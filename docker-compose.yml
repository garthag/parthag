# Self-hosting on your own server or site-office PC: CONSTRUCT DPR + PostgreSQL.
#   1. Put a strong password in .env:   POSTGRES_PASSWORD=...
#   2. docker compose up -d   →   http://localhost:8080
# Put it behind HTTPS (e.g. Caddy or IIS) before using it over the internet.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: constructdpr
      POSTGRES_USER: constructdpr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [ "pgdata:/var/lib/postgresql/data" ]
  app:
    build: .
    restart: unless-stopped
    depends_on: [ db ]
    ports: [ "8080:8080" ]
    environment:
      DATABASE_URL: postgres://constructdpr:${POSTGRES_PASSWORD}@db:5432/constructdpr
      Features__AdminPortal: ${ADMIN_PORTAL:-false}
      Site__TimeZone: ${SITE_TIMEZONE:-Asia/Kolkata}
volumes:
  pgdata:
