<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
"use strict";
/* ============================================================ basics */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const FACETS = ["sender", "subject", "body", "filename", "filetype", "date"];
const FACET_LABEL = { sender: "Sender", subject: "Subject", body: "Body/text", filename: "File name", filetype: "Type", date: "Date" };
const DOC = { invoice: "Invoice", receipt: "Receipt", statement: "Statement", payslip: "Payslip", quotation: "Quotation", order: "Order", credit_note: "Credit note", other: "Other" };
const TYPE_GROUPS = { image: ["jpg", "jpeg", "png", "gif", "webp", "heic", "tif", "tiff", "bmp"], excel: ["xls", "xlsx", "xlsm", "csv", "ods"], word: ["doc", "docx", "odt", "rtf"], archive: ["zip", "rar", "7z"], pdf: ["pdf"] };
const MIME_EXT = { "application/pdf": "pdf", "image/jpeg": "jpg", "image/png": "png" };

let rows = [], view = [], selected = new Set(), lastClick = -1, activeId = null, lastReq = null;
let sortKey = "date", sortDir = -1, sheetSort = "date", sheetDir = -1, pvMode = "doc", stopFlag = false;
const docCache = new Map(), fileCache = new Map();

function store(k, v) { try { if (v === undefined) return JSON.parse(localStorage.getItem(k)); localStorage.setItem(k, JSON.stringify(v)); } catch { return null; } }

/** google.script.run as a Promise */
function run(fn, ...args) {
  return new Promise((resolve, reject) => {
    google.script.run.withSuccessHandler(resolve).withFailureHandler((e) => reject(new Error((e && e.message) || String(e))))[fn](...args);
  });
}
/** run `worker` over items with at most n in flight (Apps Script handles parallel calls well up to ~10) */
async function pool(items, n, worker, onEach) {
  let i = 0, done = 0;
  const errors = [];
  async function next() {
    while (i < items.length && !stopFlag) {
      const k = i++;
      try { await worker(items[k], k); } catch (e) { errors.push(e); }
      done++; onEach?.(done, items.length);
    }
  }
  await Promise.all(Array.from({ length: Math.min(n, items.length) }, next));
  return errors;
}
const chunk = (a, n) => Array.from({ length: Math.ceil(a.length / n) }, (_, i) => a.slice(i * n, i * n + n));

function busy(on, msg) { $("#busy").classList.toggle("hidden", !on); if (msg) $("#busyMsg").textContent = msg; }
function progress(text, done, total) {
  const p = $("#progress");
  if (text == null) { p.classList.add("hidden"); return; }
  p.classList.remove("hidden"); $("#progText").textContent = text;
  const pct = total ? Math.round((100 * done) / total) : null;
  $("#progBar").parentElement.classList.toggle("indet", pct == null);
  $("#progBar").style.width = (pct ?? 30) + "%";
}
$("#progCancel").addEventListener("click", () => { stopFlag = true; });
let toastT;
function toast(msg, ms = 4000) { const t = $("#toast"); t.textContent = msg; t.classList.remove("hidden"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.add("hidden"), ms); }
function size(n) { if (n < 1024) return n + " B"; if (n < 1048576) return (n / 1024).toFixed(1) + " KB"; return (n / 1048576).toFixed(1) + " MB"; }
function fmtDate(iso) { return iso ? iso.slice(0, 10) : "—"; }
function money(v, cur) { if (v == null || v === "") return ""; const s = Number(v).toLocaleString("en-IN", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); return (cur && cur !== "INR" ? cur + " " : cur === "INR" ? "₹" : "") + s; }
const byId = (id) => rows.find((x) => x.key === id);
function report(html) { const r = $("#dlReport"); r.innerHTML = html; r.classList.remove("hidden"); }
function downloadBlob(blob, name) {
  const a = Object.assign(document.createElement("a"), { href: URL.createObjectURL(blob), download: name });
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 10000);
}
function b64ToBytes(b64) { const bin = atob(b64); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; }

/* ============================================================ hexagon scoring */
const MATCH = 0.6, FUZZY = 0.84;
const tokens = (s) => (String(s).toLowerCase().match(/[0-9a-z]+/g) || []);
function withInitials(toks) { const out = new Set(toks); let run = ""; for (const t of [...toks, ""]) { if (t.length === 1) run += t; else { if (run.length > 1) out.add(run); run = ""; } } return out; }
function similarity(a, b) {          // 1 - Levenshtein / max length
  const m = a.length, n = b.length; if (!m || !n) return 0;
  let prev = Array.from({ length: n + 1 }, (_, j) => j);
  for (let i = 1; i <= m; i++) { const cur = [i]; for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); prev = cur; }
  return 1 - prev[n] / Math.max(m, n);
}
function termScore(term, text, fuzzy = true) {
  if (!term || !text) return 0;
  const t = term.toLowerCase().trim(), x = String(text).toLowerCase();
  if (x.includes(t)) return 1;
  const tc = t.replace(/[^0-9a-z]/g, "");
  if (tc.length >= 3 && x.slice(0, 30000).replace(/[^0-9a-z]/g, "").includes(tc)) return 1;
  const want = tokens(term), have = withInitials(tokens(x.slice(0, 30000)));
  if (!want.length || !have.size) return 0;
  let got = 0;
  for (const w of want) {
    if (have.has(w)) { got++; continue; }
    if (!fuzzy || w.length < 4) continue;
    let best = 0;
    for (const h of have) if (Math.abs(h.length - w.length) <= 2 && (h[0] === w[0] || h.slice(-2) === w.slice(-2))) best = Math.max(best, similarity(w, h));
    if (best >= FUZZY) got += best;
  }
  return got / want.length;
}
const bestOf = (terms, text, fz) => Math.max(0, ...terms.map((t) => termScore(t, text, fz)));
function normTypes(types) { const out = []; types.forEach((t) => { t = t.toLowerCase().replace(/^[.*]+/, ""); (TYPE_GROUPS[t] || [t]).forEach((e) => { if (e && !out.includes(e)) out.push(e); }); }); return out; }
const extOf = (a) => a.ext || MIME_EXT[a.mime] || "";

function scoreItem(a, q, types) {
  const f = Object.fromEntries(FACETS.map((k) => [k, null]));
  let fz = q.fuzzy, kws = q.keywords;
  if (kws.length && q.match_mode === "phrase") { kws = [kws.join(" ")]; fz = false; }
  if (q.senders.length) f.sender = bestOf(q.senders, `${a.fromName} ${a.fromEmail}`, fz);
  let kwOk = true;
  if (kws.length) {
    const texts = { subject: a.subject, body: a.snippet + "\n" + (a.text || ""), filename: a.filename };
    const per = kws.map((k) => Object.fromEntries(Object.entries(texts).map(([n, t]) => [n, termScore(k, t, fz)])));
    for (const n of Object.keys(texts)) f[n] = Math.max(...per.map((p) => p[n]));
    // Gmail also matches words *inside* attachments: trust its hit when our own text check can't see it
    if (!a.text && a.gmailHit) f.body = Math.max(f.body, MATCH);
    kwOk = q.match_mode === "all" ? per.every((p) => Math.max(...Object.values(p)) >= MATCH || (!a.text && a.gmailHit))
                                  : Math.max(f.subject, f.body, f.filename) >= MATCH;
  }
  if (types.length) f.filetype = types.includes(extOf(a)) ? 1 : 0;
  if (q.fromTs || q.toTs) { const t = Date.parse(a.date); f.date = (!q.fromTs || t >= q.fromTs) && (!q.toTs || t <= q.toTs) ? 1 : 0; }
  let ok = kwOk;
  if (f.date !== null && f.date < 1) ok = false;
  if (f.filetype !== null && f.filetype < 1) ok = false;
  if (f.sender !== null && f.sender < MATCH) ok = false;
  if (q.exclude.some((e) => termScore(e, `${a.subject} ${a.filename}`, false) >= 1)) ok = false;
  const active = Object.entries(f).filter(([k, v]) => v !== null && !["subject", "body", "filename"].includes(k)).map(([, v]) => v);
  if (kws.length) { const kw = [f.subject, f.body, f.filename].sort((x, y) => y - x); active.push(Math.min(1, kw[0] + 0.1 * kw[1] + 0.05 * kw[2])); }
  return { score: active.length ? active.reduce((s, v) => s + v, 0) / active.length : 1, facets: f, ok };
}
function wildcard(pat) { return new RegExp("^" + pat.replace(/[.+^${}()|[\]\\]/g, "\\$&").replace(/\*/g, ".*").replace(/\?/g, ".") + "$", "i"); }
function passesFilters(a, q) {
  if (q.recipients.length && bestOf(q.recipients, a.to, q.fuzzy) < MATCH) return false;
  const pat = q.filename_pattern.trim();
  if (pat && (/[*?]/.test(pat) ? !wildcard(pat).test(a.filename) : !a.filename.toLowerCase().includes(pat.toLowerCase()))) return false;
  const amt = a.fields.amount;
  if (q.amount_min !== null && (amt == null || amt < q.amount_min)) return false;
  if (q.amount_max !== null && (amt == null || amt > q.amount_max)) return false;
  if (q.doc_types.length && !q.doc_types.includes(a.fields.doc_type || "other")) return false;
  if (q.text_state === "has_text" && !a.text_source) return false;
  if (q.text_state === "scanned" && a.text_source !== "ocr") return false;
  if (q.text_state === "not_analyzed" && a.text_source) return false;
  if (!q.include_inline && a.inline) return false;
  return true;
}
function hexSVG(f, px = 30) {
  const c = px / 2, R = px / 2 - 2;
  const pt = (i, r) => { const a = -Math.PI / 2 + (i * Math.PI) / 3; return [c + r * Math.cos(a), c + r * Math.sin(a)]; };
  const poly = (r) => FACETS.map((_, i) => pt(i, r).map((v) => v.toFixed(1)).join(",")).join(" ");
  const vals = FACETS.map((k, i) => pt(i, R * (f[k] == null ? 0.15 : Math.max(0.08, f[k]))).map((v) => v.toFixed(1)).join(",")).join(" ");
  const tip = FACETS.map((k) => `${FACET_LABEL[k]}: ${f[k] == null ? "not used" : Math.round(f[k] * 100) + "%"}`).join("\n");
  return `<svg width="${px}" height="${px}" viewBox="0 0 ${px} ${px}" role="img" aria-label="match hexagon"><title>${esc(tip)}</title>
    <polygon points="${poly(R)}" fill="none" stroke="var(--grid)" stroke-width="1"/><polygon points="${poly(R / 2)}" fill="none" stroke="var(--grid)" stroke-width=".6"/>
    <polygon points="${vals}" fill="var(--hexfill)" stroke="var(--hex)" stroke-width="1.4" stroke-linejoin="round"/></svg>`;
}

/* ============================================================ form */
const list = (s) => String(s || "").split(/[,;\n]/).map((x) => x.trim()).filter(Boolean);
const num = (s) => { const t = String(s || "").replace(/,/g, "").trim(); return t === "" || isNaN(+t) ? null : +t; };
function iso(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }
const TEXT_FIELDS = ["senders", "recipients", "keywords", "exclude", "date_from", "date_to", "filename_pattern", "size_min_mb", "size_max_mb", "amount_min", "amount_max"];
function readForm() {
  const f = $("#searchForm"), raw = {};
  for (const k of TEXT_FIELDS) raw[k] = f[k].value.trim();
  const types = $$("[name=t]:checked", f).map((x) => x.value).concat(f.custom_types.value.split(/[,\s]+/).filter(Boolean));
  Object.assign(raw, { types, doc_types: $$("[name=dt]:checked", f).map((x) => x.value), match_mode: f.match_mode.value, text_state: f.text_state.value,
    fuzzy: f.fuzzy.checked, hide_duplicates: f.hide_duplicates.checked, include_inline: f.include_inline.checked, anywhere: f.anywhere.checked,
    min_score: +f.min_score.value, window_months: +f.window_months.value });
  return raw;
}
function toQuery(raw) {
  return { ...raw, senders: list(raw.senders), keywords: list(raw.keywords), exclude: list(raw.exclude), recipients: list(raw.recipients),
    fromTs: raw.date_from ? new Date(raw.date_from + "T00:00:00").getTime() : null,
    toTs: raw.date_to ? new Date(raw.date_to + "T23:59:59.999").getTime() : null,
    amount_min: num(raw.amount_min), amount_max: num(raw.amount_max), size_min: num(raw.size_min_mb), size_max: num(raw.size_max_mb) };
}
function fillForm(q) {
  const f = $("#searchForm");
  for (const k of TEXT_FIELDS) f[k].value = q[k] || "";
  const groups = $$("[name=t]", f).map((x) => x.value);
  $$("[name=t]", f).forEach((x) => (x.checked = (q.types || []).includes(x.value)));
  $$("[name=dt]", f).forEach((x) => (x.checked = (q.doc_types || []).includes(x.value)));
  f.custom_types.value = (q.types || []).filter((t) => !groups.includes(t)).join(", ");
  f.match_mode.value = q.match_mode || "any"; f.text_state.value = q.text_state || "any";
  f.fuzzy.checked = q.fuzzy !== false; f.hide_duplicates.checked = q.hide_duplicates !== false;
  f.include_inline.checked = !!q.include_inline; f.anywhere.checked = !!q.anywhere;
}
$("#quickDates").addEventListener("click", (e) => {
  const q = e.target.dataset.q; if (!q) return;
  const t = new Date(), y = t.getFullYear(), fy = t.getMonth() >= 3 ? y : y - 1;
  const set = (a, b) => { $("[name=date_from]").value = a; $("[name=date_to]").value = b; };
  ({ fy: () => set(`${fy}-04-01`, `${fy + 1}-03-31`), lfy: () => set(`${fy - 1}-04-01`, `${fy}-03-31`), m: () => set(iso(new Date(y, t.getMonth(), 1)), iso(t)),
     y: () => set(`${y}-01-01`, `${y}-12-31`), ly: () => set(`${y - 1}-01-01`, `${y - 1}-12-31`), 90: () => set(iso(new Date(Date.now() - 90 * 864e5)), iso(t)), clr: () => set("", "") })[q]();
});
$("[name=min_score]").addEventListener("input", (e) => { $("#msOut").textContent = Math.round(e.target.value * 100) + "%"; });
$("#resetBtn").addEventListener("click", () => fillForm({ types: ["pdf"] }));
const qLabel = (q) => [q.senders, q.keywords, q.doc_types?.length && q.doc_types.join("/"), q.date_from && `${q.date_from}→${q.date_to || "…"}`].filter(Boolean).join(" · ") || "search";
function renderHistory() {
  const h = store("history") || [];
  $("#history").innerHTML = h.length ? "<div class='muted'>Recent searches</div>" + h.map((q, i) => `<a data-i="${i}">${esc(qLabel(q))}</a>`).join("") : "";
}
$("#history").addEventListener("click", (e) => { const i = e.target.dataset.i; if (i != null) { fillForm(store("history")[i]); $("#searchForm").requestSubmit(); } });

/* ============================================================ search */
$("#searchForm").addEventListener("submit", async (e) => {
  e.preventDefault(); $("#searchErr").textContent = "";
  const raw = readForm(), q = toQuery(raw);
  if (!q.senders.length && !q.keywords.length && !q.fromTs && !q.toTs && !q.recipients.length && !q.filename_pattern) {
    $("#searchErr").textContent = "Give at least a sender, a keyword or a date range"; return;
  }
  stopFlag = false; const t0 = performance.now();
  try {
    progress("Planning search…");
    const plan = await run("planSearch", { senders: q.senders, keywords: q.keywords, matchMode: q.match_mode, exclude: q.exclude, recipients: q.recipients,
      fromTs: q.fromTs, toTs: q.toTs, types: q.types, sizeMinMb: q.size_min, sizeMaxMb: q.size_max, anywhere: q.anywhere, windowMonths: q.window_months });
    // 1. matrix cells in parallel -> a Set of message ids (no duplicates)
    const ids = new Set();
    await pool(plan.queries, 6, async (query) => {
      let tok = null;
      do { const r = await run("listIds", query, tok); r.ids.forEach((i) => ids.add(i)); tok = r.next; } while (tok && ids.size < 5000 && !stopFlag);
    }, (d, n) => progress(`Searching Gmail · ${d}/${n} matrix cells · ${ids.size} emails`, d, n));
    // 2. attachment details in parallel batches
    const items = [];
    await pool(chunk([...ids], 15), 8, async (c) => { items.push(...(await run("getMeta", c))); },
      (d, n) => progress(`Reading ${ids.size} emails · ${items.length} attachments`, d, n));
    // 3. what we already know (read text, amounts, your corrections)
    progress("Merging saved details…");
    const known = items.length ? await run("getStored", items.map((i) => i.key)) : {};
    items.forEach((it) => { const k = known[it.key]; it.gmailHit = true; if (k) { it.fields = k.fields; it.text_source = k.text_source; it.text = k.text; it.drive_id = k.drive_id; } });
    // 4. same email under two ids (forwarded copies share Message-ID) -> keep one
    const seen = new Set(); let dupMsgs = 0;
    const uniq = items.filter((it) => { const k = (it.messageId || it.msgId) + "|" + it.partId; if (seen.has(k)) { dupMsgs++; return false; } seen.add(k); return true; });
    // 5. hexagon + exact filters
    const types = normTypes(q.types);
    let matched = [];
    for (const it of uniq) {
      if (!passesFilters(it, q)) continue;
      const s = scoreItem(it, q, types);
      if (s.ok && s.score >= q.min_score) matched.push(Object.assign(it, { score: s.score, facets: s.facets, duplicates: 0 }));
    }
    // 6. same file sent again -> one row with "+n dup"
    matched.sort((a, b) => Date.parse(a.date) - Date.parse(b.date));
    let dupFiles = 0;
    if (q.hide_duplicates) {
      const keep = new Map();

      matched = [...keep.values()];
    }
    matched.sort((a, b) => Date.parse(b.date) - Date.parse(a.date));
    rows = matched; selected.clear(); lastClick = -1; docCache.clear(); lastReq = q;
    store("lastQuery", raw);
    store("history", [raw, ...(store("history") || []).filter((x) => qLabel(x) !== qLabel(raw))].slice(0, 8)); renderHistory();
    const secs = ((performance.now() - t0) / 1000).toFixed(1), total = rows.reduce((s, r) => s + (r.fields.amount || 0), 0);
    $("#stats").innerHTML = `<b>${rows.length}</b> attachment${rows.length === 1 ? "" : "s"} · <b>${size(rows.reduce((s, r) => s + r.size, 0))}</b>` +
      (total ? ` · total <b>${money(total)}</b>` : "") + ` · <b>${secs} s</b> <span class="badge">${plan.cells} matrix cells</span>` +
      `<span class="badge">${ids.size} emails</span>` + (dupMsgs ? `<span class="badge">${dupMsgs} duplicate emails removed</span>` : "") +
      (dupFiles ? `<span class="badge">${dupFiles} duplicate files removed</span>` : "") + (stopFlag ? `<span class="badge">stopped early</span>` : "");
    $("#dlReport").classList.add("hidden");
    showView("search"); render(); renderSheet();
  } catch (er) { $("#searchErr").textContent = er.message; }
  finally { progress(null); }
});

/* ============================================================ results table */
function sortVal(r, k) { return k === "amount" ? (r.fields.amount ?? -1) : (r[k] ?? ""); }
function render() {
  const f = $("#filter").value.trim().toLowerCase();
  view = rows.filter((r) => !f || `${r.filename} ${r.fromName} ${r.fromEmail} ${r.subject} ${r.date} ${r.fields.doc_no || ""} ${r.fields.amount || ""}`.toLowerCase().includes(f));
  view.sort((a, b) => { const x = sortVal(a, sortKey), y = sortVal(b, sortKey); return (x < y ? -1 : x > y ? 1 : 0) * sortDir; });
  $("#tbl tbody").innerHTML = view.map((r, i) => {
    const d = r.fields.doc_type && r.fields.doc_type !== "other" ? `<span class="doc d-${esc(r.fields.doc_type)}">${esc(DOC[r.fields.doc_type] || r.fields.doc_type)}${r.fields.doc_no ? " " + esc(r.fields.doc_no) : ""}</span>` : "";
    return `<tr data-i="${i}" class="${selected.has(r.key) ? "sel" : ""} ${r.key === activeId ? "active" : ""}">
      <td class="c"><input type="checkbox" ${selected.has(r.key) ? "checked" : ""} aria-label="select"></td>
      <td><div class="hexcell">${hexSVG(r.facets)}<span>${Math.round(r.score * 100)}%</span></div></td>
      <td><div class="fn"><span class="ext x-${esc(r.ext)}">${esc(r.ext || "file")}</span>${esc(r.filename)}${r.duplicates ? `<span class="badge" title="identical copies hidden">+${r.duplicates} dup</span>` : ""}${r.text_source === "ocr" ? ` <span class="src s-ocr">OCR</span>` : ""}${r.risky ? ` <span class="risky" title="Can run programs/macros – only open if you trust the sender">⚠ risky file</span>` : ""}</div>
          <div class="sub">${d}${esc(r.subject)}</div></td>
      <td class="cf"><div>${esc(r.fromName)}</div><div class="sub hide-sm">${esc(r.fromEmail)}</div></td>
      <td class="r cf amt">${money(r.fields.amount, r.fields.currency)}</td>
      <td class="nw">${fmtDate(r.date)}</td><td class="r nw">${size(r.size)}</td>
      <td><button class="btn ghost pv" title="Preview">👁</button></td></tr>`;
  }).join("");
  $("#empty").classList.toggle("hidden", !!view.length || !rows.length);
  $$("#tbl th[data-sort]").forEach((th) => { th.textContent = th.textContent.replace(/ [▴▾]$/, "") + (th.dataset.sort === sortKey ? (sortDir < 0 ? " ▾" : " ▴") : ""); });
  updateSel();
}
function updateSel() {
  const sel = rows.filter((r) => selected.has(r.key));
  const amt = sel.reduce((a, r) => a + (r.fields.amount || 0), 0);
  $("#selInfo").textContent = `${selected.size} selected${selected.size ? " · " + size(sel.reduce((a, r) => a + r.size, 0)) : ""}${amt ? " · " + money(amt) : ""}`;
  $$(".need-sel").forEach((b) => (b.disabled = !selected.size));
  $$(".need-sel-s").forEach((b) => b.setAttribute("aria-disabled", String(!selected.size)));
  $("#chkAll").checked = view.length > 0 && view.every((r) => selected.has(r.key));
  $("#pvSel").textContent = activeId && selected.has(activeId) ? "Selected ✓" : "Select";
}
function toggle(id, on) { (on ?? !selected.has(id)) ? selected.add(id) : selected.delete(id); }
$("#tbl tbody").addEventListener("click", (e) => {
  const tr = e.target.closest("tr"); if (!tr) return;
  const i = +tr.dataset.i, r = view[i];

async function pdfReady() {

        pdfjsLib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(new Blob([src], { type: "text/javascript" }));
      } catch { pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"; }

function shareText(list) {
  let total = 0;
  const lines = list.map((r) => { const a = r.fields.amount; total += a || 0; return [fmtDate(r.date), r.filename, r.fromName, r.fields.doc_no && "#" + r.fields.doc_no, a != null && money(a, r.fields.currency)].filter(Boolean).join(" | "); });
  if (total) lines.push(`Total: ${money(total)} (${list.length} files)`);
  return lines.join("\n");
}
$("#shareForm").addEventListener("submit", async (e) => {
  const action = e.submitter?.value; if (!action || action === "cancel") return;
  e.preventDefault();
  const f = $("#shareForm"), items = selItems(), msg = $("#shareMsg");
  try {
    if (action === "copy") { try { await navigator.clipboard.writeText(shareText(items)); msg.textContent = "✔ List copied – paste it in WhatsApp, email or a document."; } catch { msg.textContent = "Copy not allowed here."; } return; }
    msg.textContent = action === "email" ? "Sending…" : "Creating shared folder…";
    if (action === "email") { const r = await run("shareEmail", items.map(slim), f.to.value, f.subject.value, f.message.value); msg.innerHTML = `✔ Sent ${r.files} file(s) to ${esc(r.sentTo.join(", "))}`; }
    else { const r = await run("shareDrive", items.map(slim), f.to.value, f.message.value); msg.innerHTML = `✔ Shared ${r.files} file(s) with ${esc(r.sharedWith.join(", "))} – <a href="${esc(r.link)}" target="_blank" rel="noopener">open folder ↗</a>`; }
  } catch (er) { msg.innerHTML = `<span class="err">${esc(er.message)}</span>`; }
});

/* ============================================================ views / data */
function showView(v) {
  $$("#tabs button").forEach((b) => b.classList.toggle("on", b.dataset.view === v));
  $("#viewSearch").classList.toggle("hidden", v !== "search");
  $("#viewTable").classList.toggle("hidden", v !== "table");
  $("#viewData").classList.toggle("hidden", v !== "data");
  if (v !== "search") closePreview(true);
  if (v === "table") renderSheet();
  if (v === "data") refreshData();
}
$("#tabs").addEventListener("click", (e) => { const v = e.target.closest("button")?.dataset.view; if (v) showView(v); });
async function refreshData() {
  try {
    const u = await run("getUser");
    $("#account").textContent = u.email;
    const s = u.store, k = (v, l) => `<div class="kpi"><b>${v}</b><span>${l}</span></div>`;
    $("#kpis").innerHTML = k(s.rows || 0, "documents read / corrected") + k(rows.length, "in current results") + k(esc(u.timeZone), "time zone");
    const a = $("#openStore"); if (s.url) { a.href = s.url; a.classList.remove("hidden"); } else a.classList.add("hidden");
  } catch (er) { toast(er.message); }
}
$("#eraseBtn").addEventListener("click", async () => {
  if (!confirm("Erase this app's data?\n\nThe data sheet (detected fields, text read from files, your corrections) is moved to the Drive Bin.\nYour email and files saved in \"Mail Attachments\" are NOT touched.")) return;
  try { const r = await run("eraseData"); try { localStorage.clear(); } catch { /* ignore */ } toast(r.note, 6000); refreshData(); } catch (er) { toast(er.message); }
});

/* ============================================================ start */
(function init() {
  pvMode = store("pvMode") || "doc";
  const last = store("lastQuery"); if (last) fillForm(last);
  if (store("layout")) $("#layout").value = store("layout");
  if (store("naming")) $("#naming").value = store("naming");
  renderHistory();
  run("getUser").then((u) => { $("#account").textContent = u.email; }).catch((e) => { $("#account").textContent = ""; toast(e.message, 8000); });
})();
</script>
