# Supabase CLI configuration (local development with `supabase start`).
project_id = "construct-dpr"

[api]
port = 54321
schemas = ["public"]
max_rows = 5000

[db]
port = 54322
major_version = 15

[realtime]
enabled = true

[auth]
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:4173"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_confirmations = false

# Google sign-in: create an OAuth client (see docs/GOOGLE_SETUP.md) and set
# SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID / _SECRET in your shell.
[auth.external.google]
enabled = false
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"

[functions.drive]
verify_jwt = true
