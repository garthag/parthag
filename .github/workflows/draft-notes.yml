name: Draft Notes

# Builds the Draft Notes app in draft_notes/ only when it changes.
on:
  push:
    paths:
      - 'draft_notes/**'
      - '.github/workflows/draft-notes.yml'
  pull_request:
    paths:
      - 'draft_notes/**'
      - '.github/workflows/draft-notes.yml'
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: draft_notes

jobs:
  test-and-build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.1'
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-release.apk ../DraftNotes-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: draft-notes-apk
          path: DraftNotes-android.apk

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.1'
          cache: true

      - run: flutter pub get

      - name: Build Windows app
        run: flutter build windows --release

      - name: Zip Windows app
        shell: pwsh
        run: |
          Copy-Item -Recurse build/windows/x64/runner/Release DraftNotes
          Compress-Archive -Path DraftNotes -DestinationPath ../DraftNotes-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: draft-notes-windows
          path: DraftNotes-windows.zip

  # On pushes, publish both builds as a release of their own. It is not
  # marked "latest", so the Site DPR download links keep working.
  release:
    if: github.event_name == 'push'
    needs: [test-and-build-apk, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: draft-notes-*
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: draft-notes-build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Draft Notes build ${{ github.run_number }}
          make_latest: false
          body: |
            **Android:** download `DraftNotes-android.apk` on the phone and open it to install.
            **Windows:** download `DraftNotes-windows.zip`, extract it, and run `draft_notes.exe` inside the `DraftNotes` folder.

            See draft_notes/README.md for what the app does.
          files: |
            DraftNotes-android.apk
            DraftNotes-windows.zip
