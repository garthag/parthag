name: SiteNotes C# build

on:
  push:
    paths: ['dotnet/**', '.github/workflows/dotnet.yml']
  pull_request:
    paths: ['dotnet/**', '.github/workflows/dotnet.yml']
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Core, report and sync tests
        run: dotnet test dotnet/tests/SiteNotes.Core.Tests -c Release
      - name: Compile-check Android UI code
        run: dotnet build dotnet/tests/SiteNotes.App.CompileCheck -c Release
      - name: Compile WPF desktop app
        run: dotnet build dotnet/src/SiteNotes.Desktop -c Release

  server:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish server (Windows + Linux)
        run: |
          dotnet publish dotnet/src/SiteNotes.Server -c Release -r win-x64 --self-contained -o out/SiteNotesServer-windows
          dotnet publish dotnet/src/SiteNotes.Server -c Release -r linux-x64 --self-contained -o out/SiteNotesServer-linux
          cd out && zip -qr ../SiteNotesServer-windows.zip SiteNotesServer-windows && zip -qr ../SiteNotesServer-linux.zip SiteNotesServer-linux
      - uses: actions/upload-artifact@v4
        with:
          name: sitenotes-server
          path: SiteNotesServer-*.zip

  windows:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: WPF screen tests
        run: dotnet test dotnet/tests/SiteNotes.Desktop.Tests -c Release
      - name: Publish Windows desktop app (WPF)
        run: dotnet publish dotnet/src/SiteNotes.Desktop -c Release -r win-x64 --self-contained -o out/SiteNotes
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path out/SiteNotes -DestinationPath SiteNotes-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: sitenotes-windows
          path: SiteNotes-windows.zip

  android:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install .NET MAUI Android workload
        run: dotnet workload install maui-android
      - name: Build Android APK
        run: dotnet publish dotnet/src/SiteNotes.App -f net10.0-android -c Release -o out/android
      - name: Package
        shell: pwsh
        run: |
          $apk = Get-ChildItem out/android -Filter *-Signed.apk | Select-Object -First 1
          if (-not $apk) { $apk = Get-ChildItem out/android -Filter *.apk | Select-Object -First 1 }
          Copy-Item $apk.FullName SiteNotes-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: sitenotes-android
          path: SiteNotes-android.apk

  release:
    if: github.event_name == 'push'
    needs: [windows, android, server]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: sitenotes-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: SiteNotes DPR (C#) build ${{ github.run_number }}
          make_latest: false
          body: |
            **Windows PC:** extract `SiteNotes-windows.zip` and run `SiteNotes.exe` (WPF desktop app).
            **Android:** install `SiteNotes-android.apk` on the phone.
            **Sync server (optional):** extract `SiteNotesServer-windows.zip` or `SiteNotesServer-linux.zip`, set the site key in `appsettings.json`, run `SiteNotes.Server`.
          files: |
            SiteNotes-android.apk
            SiteNotes-windows.zip
            SiteNotesServer-windows.zip
            SiteNotesServer-linux.zip
