name: SiteNotes C# build

on:
  push:
    paths: ['dotnet/**', '.github/workflows/dotnet.yml']
  pull_request:
    paths: ['dotnet/**', '.github/workflows/dotnet.yml']
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Unit & sync tests
        run: dotnet test dotnet/tests/SiteNotes.Core.Tests -c Release
      - name: Compile-check app UI code
        run: dotnet build dotnet/tests/SiteNotes.App.CompileCheck -c Release

  server:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish server (Windows + Linux)
        run: |
          dotnet publish dotnet/src/SiteNotes.Server -c Release -r win-x64 --self-contained -o out/SiteNotesServer-windows
          dotnet publish dotnet/src/SiteNotes.Server -c Release -r linux-x64 --self-contained -o out/SiteNotesServer-linux
          cd out && zip -qr ../SiteNotesServer-windows.zip SiteNotesServer-windows && zip -qr ../SiteNotesServer-linux.zip SiteNotesServer-linux
      - uses: actions/upload-artifact@v4
        with:
          name: sitenotes-server
          path: SiteNotesServer-*.zip

  app:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install .NET MAUI workload
        run: dotnet workload install maui
      - name: Build Android APK
        run: dotnet publish dotnet/src/SiteNotes.App -f net10.0-android -c Release -o out/android
      - name: Build Windows app
        run: dotnet publish dotnet/src/SiteNotes.App -f net10.0-windows10.0.19041.0 -c Release -r win-x64 --self-contained -p:WindowsPackageType=None -o out/SiteNotes
      - name: Package
        shell: pwsh
        run: |
          $apk = Get-ChildItem out/android -Filter *-Signed.apk | Select-Object -First 1
          if (-not $apk) { $apk = Get-ChildItem out/android -Filter *.apk | Select-Object -First 1 }
          Copy-Item $apk.FullName SiteNotes-android.apk
          Compress-Archive -Path out/SiteNotes -DestinationPath SiteNotes-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: sitenotes-app
          path: |
            SiteNotes-android.apk
            SiteNotes-windows.zip

  release:
    if: github.event_name == 'push'
    needs: [app, server]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: sitenotes-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: SiteNotes DPR (C#) build ${{ github.run_number }}
          make_latest: false
          body: |
            **Android:** install `SiteNotes-android.apk`.
            **Windows:** extract `SiteNotes-windows.zip` and run `SiteNotes.App.exe`.
            **Sync server (optional):** extract `SiteNotesServer-windows.zip` or `SiteNotesServer-linux.zip`, set the site key in `appsettings.json` and run `SiteNotes.Server`.
          files: |
            SiteNotes-android.apk
            SiteNotes-windows.zip
            SiteNotesServer-windows.zip
            SiteNotesServer-linux.zip
