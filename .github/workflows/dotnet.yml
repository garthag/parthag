name: SiteNotes C# build

on:
  push:
    paths: ['dotnet/**', '.github/workflows/dotnet.yml']
  pull_request:
    paths: ['dotnet/**', '.github/workflows/dotnet.yml']
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Core, report and sync tests
        run: dotnet test dotnet/tests/SiteNotes.Core.Tests -c Release
      - name: Compile-check Android UI code
        run: dotnet build dotnet/tests/SiteNotes.App.CompileCheck -c Release
      - name: Compile WPF desktop app
        run: dotnet build dotnet/src/SiteNotes.Desktop -c Release
      - name: Heavy demo – 3 projects, 3 devices, 1 year of reports, every report generated and verified
        run: dotnet run -c Release --project dotnet/tools/SiteNotes.Demo -- demo-output 365
      - name: Package demo reports
        if: always()
        run: |
          rm -rf demo-output/_devices
          cd demo-output && zip -qr ../SiteNotes-Demo-Reports.zip .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-reports
          path: SiteNotes-Demo-Reports.zip
          if-no-files-found: ignore

  server:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish server (Windows + Linux)
        run: |
          dotnet publish dotnet/src/SiteNotes.Server -c Release -r win-x64 --self-contained -o out/SiteNotesServer-windows
          dotnet publish dotnet/src/SiteNotes.Server -c Release -r linux-x64 --self-contained -o out/SiteNotesServer-linux
          cd out && zip -qr ../SiteNotesServer-windows.zip SiteNotesServer-windows && zip -qr ../SiteNotesServer-linux.zip SiteNotesServer-linux
      - uses: actions/upload-artifact@v4
        with:
          name: sitenotes-server
          path: SiteNotesServer-*.zip

  windows:
    runs-on: windows-latest
    needs: test
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: WPF screen tests (also captures every screen)
        env:
          SCREENSHOT_DIR: ${{ github.workspace }}\screens-windows
        run: dotnet test dotnet/tests/SiteNotes.Desktop.Tests -c Release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens-windows
          path: screens-windows
          if-no-files-found: ignore
      - name: Publish Windows desktop app (WPF)
        run: dotnet publish dotnet/src/SiteNotes.Desktop -c Release -r win-x64 --self-contained -o out/SiteNotes
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path out/SiteNotes -DestinationPath SiteNotes-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: sitenotes-windows
          path: SiteNotes-windows.zip

  android:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install .NET MAUI Android workload
        run: dotnet workload install maui-android
      - name: Build Android APK
        run: dotnet publish dotnet/src/SiteNotes.App -f net10.0-android -c Release -o out/android
      - name: Package
        shell: pwsh
        run: |
          $apk = Get-ChildItem out/android -Filter *-Signed.apk | Select-Object -First 1
          if (-not $apk) { $apk = Get-ChildItem out/android -Filter *.apk | Select-Object -First 1 }
          Copy-Item $apk.FullName SiteNotes-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: sitenotes-android
          path: SiteNotes-android.apk

  android-screens:
    runs-on: ubuntu-latest
    needs: android
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@v4
        with:
          name: sitenotes-android
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run app on emulator and capture every screen
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash dotnet/tools/android-tour.sh SiteNotes-android.apk screens-android
      - name: Build PDF of the Android screens
        env:
          ANDROID_SHOTS_DIR: ${{ github.workspace }}/screens-android
        run: dotnet test dotnet/tests/SiteNotes.Core.Tests -c Release --filter AndroidScreensPdf
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens-android
          path: screens-android
          if-no-files-found: ignore

  release:
    if: github.event_name == 'push'
    needs: [windows, android, server]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: sitenotes-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: SiteNotes DPR (C#) build ${{ github.run_number }}
          make_latest: false
          body: |
            **Windows PC:** extract `SiteNotes-windows.zip` and run `SiteNotes.exe` (WPF desktop app).
            **Android:** install `SiteNotes-android.apk` on the phone.
            **Sync server (optional):** extract `SiteNotesServer-windows.zip` or `SiteNotesServer-linux.zip`, set the site key in `appsettings.json`, run `SiteNotes.Server`.
          files: |
            SiteNotes-android.apk
            SiteNotes-windows.zip
            SiteNotesServer-windows.zip
            SiteNotesServer-linux.zip

  publish-screens:
    if: github.event_name == 'push' && always() && needs.release.result == 'success'
    needs: [release, android-screens, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: screens-*
          path: screens
      - uses: actions/download-artifact@v4
        with:
          name: demo-reports
          path: demo
      - name: Collect PDFs and pictures
        run: |
          mkdir -p out
          find screens -name '*.pdf' -exec cp {} out/ \;
          (cd screens && zip -qr ../out/SiteNotes-Screens.zip . -i '*.png' '*.pdf' '*.txt') || true
          cp demo/*.zip out/ || true
          ls -la out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: sitenotes-${{ github.run_number }}
          files: out/*
