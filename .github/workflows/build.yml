name: Build and release (C# / .NET 10)

# One pipeline for the whole C# solution:
#   test     – unit + server tests, Microsoft SQL Server end-to-end test, sync-server smoke test on SQL Server
#   windows  – WPF app (installer + single .exe) with screenshots, sync server for a Windows PC
#   android  – native .NET MAUI Android app (.apk)
#   publish  – replaces the "apps-latest" download page with the new files (fixed names, links never change)
on:
  push:
    branches: [main, claude/construct-dpr-app-z3h0j8]
    paths-ignore: ['legacy/**', '**.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  VERSION: 2.1.${{ github.run_number }}

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env: { ACCEPT_EULA: "Y", MSSQL_SA_PASSWORD: "Ci-only-Passw0rd!" }
        ports: [ "1433:1433" ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 10.0.x }
      - name: Tests (incl. Microsoft SQL Server end-to-end)
        env:
          CDPR_SQLSERVER: "Server=localhost,1433;User Id=sa;Password=Ci-only-Passw0rd!;TrustServerCertificate=true;Encrypt=true"
        run: |
          for i in $(seq 1 30); do (echo > /dev/tcp/localhost/1433) 2>/dev/null && break; sleep 2; done
          sleep 10 # SQL Server accepts connections a little after the port opens
          dotnet test tests/ConstructDpr.Tests -c Release --logger "console;verbosity=normal"
      - name: Publish sync server (Linux)
        run: dotnet publish src/ConstructDpr.Server -c Release -p:Version=$VERSION -o out/server-linux
      - name: Smoke test of the sync server on SQL Server (sign up, demo project, PDF)
        run: |
          cd out/server-linux
          Database__Provider=SqlServer ConnectionStrings__Default="Server=localhost,1433;Database=cdpr_smoke;User Id=sa;Password=Ci-only-Passw0rd!;TrustServerCertificate=true" \
            dotnet ConstructDpr.Server.dll --urls http://127.0.0.1:5080 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:5080/health && break; sleep 1; done
          curl -sf -X POST http://127.0.0.1:5080/api/account/register -H 'content-type: application/json' -d '{"email":"ci@example.com","password":"ci-password-1","displayName":"CI"}'
          TOKEN=$(curl -sf -X POST http://127.0.0.1:5080/api/identity/login -H 'content-type: application/json' -d '{"email":"ci@example.com","password":"ci-password-1"}' | jq -r .accessToken)
          PID=$(curl -sf -X POST http://127.0.0.1:5080/api/projects/demo -H "authorization: Bearer $TOKEN" -H 'content-type: application/json' -d '{}' | jq -r .id)
          curl -sf http://127.0.0.1:5080/api/projects/$PID/dashboard -H "authorization: Bearer $TOKEN" | jq '{plannedPct, actualPct, pendingApprovals}'
          curl -sf -o schedule.pdf http://127.0.0.1:5080/api/projects/$PID/reports/SchedulePdf -H "authorization: Bearer $TOKEN"
          head -c 4 schedule.pdf | grep -q '%PDF'
          curl -sf http://127.0.0.1:5080/ | grep -q 'sync server'
          echo "Smoke test passed"
      - name: Sample reports (QuestPDF + ClosedXML)
        run: dotnet run --project tools/ConstructDpr.Preview -c Release -- out/samples
      - name: Package
        run: |
          cd out && (cd server-linux && zip -qr ../CONSTRUCT-DPR-server-linux.zip .)
      - uses: actions/upload-artifact@v4
        with:
          name: server-linux
          path: |
            out/CONSTRUCT-DPR-server-linux.zip
            out/samples/*

  windows:
    runs-on: windows-latest
    defaults: { run: { shell: pwsh } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 10.0.x }
      - name: Publish the Windows app (single self-contained .exe)
        run: >
          dotnet publish src/ConstructDpr.App/ConstructDpr.App.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true
          -p:Version=${{ env.VERSION }} -o publish/app
      - name: Screenshots of every screen (fresh offline demo database)
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          $p = Start-Process -FilePath "publish\app\ConstructDpr.exe" -ArgumentList "--screenshots", "$PWD\out" -PassThru
          if (-not $p.WaitForExit(240000)) { $p.Kill(); throw "Screenshot run timed out" }
          if (Test-Path out\error.txt) { Get-Content out\error.txt; Remove-Item out\error.txt }
          if ($p.ExitCode -ne 0) { throw "Screenshot run failed with exit code $($p.ExitCode)" }
          if ((Get-ChildItem out -Filter *.png).Count -lt 9) { throw "Expected 9 screenshots" }
          Get-ChildItem out | ForEach-Object { Rename-Item $_.FullName ("windows-" + $_.Name) }
      - name: Publish the sync server for a Windows PC
        run: dotnet publish src/ConstructDpr.Server -c Release -r win-x64 --self-contained true -p:Version=${{ env.VERSION }} -o publish/server
      - name: Windows installer (Inno Setup)
        run: |
          choco install innosetup --no-progress -y | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyVersion=${{ env.VERSION }}" "/DSourceExe=$PWD\publish\app\ConstructDpr.exe" installer\ConstructDpr.iss
          if (-not (Test-Path out\CONSTRUCT-DPR-windows-setup.exe)) { throw "Installer not built" }
      - name: Collect
        run: |
          Copy-Item publish\app\ConstructDpr.exe out\CONSTRUCT-DPR-windows.exe
          Compress-Archive -Path publish\server\* -DestinationPath out\CONSTRUCT-DPR-server-windows.zip
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: out/* }

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 10.0.x }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - name: Install the .NET MAUI Android workload
        run: dotnet workload install maui-android
      - name: Build the Android app (.apk)
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          SIGN=""
          # With signing secrets the app keeps one signature, so new versions install over old ones.
          # Without them it is signed with a build-machine key: uninstall the old app before installing a new build.
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.keystore"
            SIGN="-p:AndroidKeyStore=true -p:AndroidSigningKeyStore=$RUNNER_TEMP/release.keystore -p:AndroidSigningStorePass=env:KEYSTORE_PASSWORD -p:AndroidSigningKeyAlias=$KEY_ALIAS -p:AndroidSigningKeyPass=env:KEY_PASSWORD"
          fi
          dotnet publish src/ConstructDpr.Mobile/ConstructDpr.Mobile.csproj -f net10.0-android -c Release \
            -p:ApplicationVersion=${{ github.run_number }} -p:ApplicationDisplayVersion=${{ env.VERSION }} \
            -p:AndroidSdkDirectory=$ANDROID_HOME $SIGN -o out
      - name: Collect
        run: |
          ls -la out
          cp "$(ls out/*-Signed.apk | head -1)" CONSTRUCT-DPR-android.apk
      - uses: actions/upload-artifact@v4
        with: { name: android, path: CONSTRUCT-DPR-android.apk }

  publish:
    needs: [test, windows, android]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with: { path: built, merge-multiple: true }
      - name: Replace the download page (old files are removed)
        run: |
          mkdir dist
          find built -type f \( -name '*.apk' -o -name '*.exe' -o -name '*.zip' -o -name '*.png' -o -name 'sample-*' -o -name 'activity-import-template.xlsx' \) -exec cp {} dist/ \;
          ls -la dist
          gh release delete apps-latest --cleanup-tag --yes || true
          gh release delete desktop-latest --cleanup-tag --yes || true
          cat > notes.md <<NOTES
          **CONSTRUCT DPR $VERSION** — one C# / .NET 10 code base, built $(date -u '+%d %b %Y %H:%M UTC') from commit ${GITHUB_SHA::7}.

          | Device | File | |
          |---|---|---|
          | Windows PC (install) | **CONSTRUCT-DPR-windows-setup.exe** | Start menu + desktop icon + uninstaller; no administrator rights needed |
          | Windows PC (no install) | **CONSTRUCT-DPR-windows.exe** | Double-click. "Windows protected your PC" → More info → Run anyway |
          | Android phone / tablet | **CONSTRUCT-DPR-android.apk** | Open on the phone → allow installing from this source → Install |
          | Sync server (Windows PC) | **CONSTRUCT-DPR-server-windows.zip** | Only needed for phones: unzip next to SQL Server, run ConstructDpr.Server.exe |
          | Sync server (Linux) | **CONSTRUCT-DPR-server-linux.zip** | Same, for a Linux machine (.NET 10 ASP.NET Core runtime) |

          Everything is C# (.NET 10): Windows app in WPF, Android app in .NET MAUI, data in Microsoft SQL Server (or SQLite on one PC).
          Windows modes (Settings): **This PC only** · **Office SQL Server** · **Sync server**. Guide: docs/START_HERE.md
          NOTES
          gh release create apps-latest dist/* --target "$GITHUB_SHA" --latest \
            --title "CONSTRUCT DPR $VERSION (C# / .NET) — $(date -u '+%d %b %Y')" --notes-file notes.md
