name: Desktop (C# / SQL Server)

on:
  push:
    paths: ['desktop/**', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['desktop/**', '.github/workflows/desktop.yml']
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build solution
        run: dotnet build desktop/BSL.ProjectControl.sln -c Release

      - name: Self-test (formulas, drawing / section / grade rules)
        run: dotnet run --project desktop/src/BSL.Cli -c Release --no-build -- selftest

      - name: Publish Windows app (self-contained, single file)
        run: >
          dotnet publish desktop/src/BSL.Desktop/BSL.Desktop.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true
          -p:DebugType=none -o desktop/publish/release

      - name: Build installer (NSIS is preinstalled on windows-latest)
        shell: pwsh
        working-directory: desktop/installer
        run: |
          $nsis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path $nsis)) { choco install nsis -y --no-progress; $nsis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe" }
          & $nsis -DVERSION=1.1.0 -DSRC=..\publish\release BSLProjectControl.nsi

      - name: Portable zip
        shell: pwsh
        run: |
          $p = "BSLProjectControl-portable"
          New-Item -ItemType Directory -Force "$p/database", "$p/fonts" | Out-Null
          Copy-Item desktop/publish/release/BSLProjectControl.exe, desktop/README.md, desktop/installer/app.ico $p
          Copy-Item desktop/database/*.sql "$p/database"
          Compress-Archive -Path $p -DestinationPath BSLProjectControl-portable.zip

      - uses: actions/upload-artifact@v4
        with:
          name: bsl-project-control-windows
          path: |
            desktop/installer/BSLProjectControl-Setup-*.exe
            BSLProjectControl-portable.zip
