name: Drawing Reader CI/CD

on:
  push:
    paths: ["drawing-reader/**", ".github/workflows/drawing-reader.yml"]
  pull_request:
    paths: ["drawing-reader/**", ".github/workflows/drawing-reader.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: drawing-reader-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}/drawing-reader

jobs:
  backend:
    name: Backend · lint, format, migrate, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: drawing-reader/backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: drawing
          POSTGRES_PASSWORD: drawing
          POSTGRES_DB: drawing_reader
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U drawing" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: drawing-reader/backend/requirements*.txt
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check app tests
      - name: Format
        run: ruff format --check app tests
      - name: Migrations (PostgreSQL 16) — upgrade, drift check, downgrade, upgrade
        env:
          DATABASE_URL: postgresql+psycopg://drawing:drawing@localhost:5432/drawing_reader
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head
      - name: Seed smoke test (PostgreSQL)
        env:
          DATABASE_URL: postgresql+psycopg://drawing:drawing@localhost:5432/drawing_reader
          STORAGE_DIR: /tmp/storage
          REDIS_URL: ""
        run: python -m app.seed.seed --no-pdfs
      - name: Tests (unit, integration, OCR, BOM, revision, API, dashboard)
        run: pytest --cov=app --cov-report=term --cov-report=xml --cov-fail-under=90
      - name: Export and validate OpenAPI 3.1
        run: python scripts/export_openapi.py /tmp/openapi.json
      - uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: drawing-reader/backend/coverage.xml

  frontend:
    name: Frontend · lint, typecheck, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: drawing-reader/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: drawing-reader/frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build

  docker:
    name: Build images${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && ' & push' || '' }}
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Backend image
        uses: docker/build-push-action@v6
        with:
          context: drawing-reader/backend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.REGISTRY }}/backend:${{ github.sha }}
            ${{ env.REGISTRY }}/backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Frontend image
        uses: docker/build-push-action@v6
        with:
          context: drawing-reader/frontend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.REGISTRY }}/frontend:${{ github.sha }}
            ${{ env.REGISTRY }}/frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: Validate compose files
        working-directory: drawing-reader
        run: |
          printf 'POSTGRES_PASSWORD=x\nSECRET_KEY=ci-validation-secret-key-0123456789abcdef\n' > .env.ci
          docker compose -f docker-compose.prod.yml --env-file .env.ci config --quiet
          docker compose -f docker-compose.dev.yml config --quiet

  deploy:
    name: Deploy
    needs: [docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
    steps:
      - name: Skip when no deployment target is configured
        if: env.DEPLOY_HOST == ''
        run: echo "DEPLOY_HOST secret not set; images were pushed, skipping remote deploy."
      - name: Deploy over SSH
        if: env.DEPLOY_HOST != ''
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_deploy "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && git pull --ff-only && \
             export REGISTRY='${{ env.REGISTRY }}' IMAGE_TAG='${{ github.sha }}' && \
             docker compose -f docker-compose.prod.yml --env-file .env pull && \
             docker compose -f docker-compose.prod.yml --env-file .env up -d --remove-orphans && \
             docker image prune -f"
