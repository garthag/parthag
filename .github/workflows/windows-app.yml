name: Windows app

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
    paths:
      - "mail_agent/**"
      - "windows/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/windows-app.yml"
  workflow_dispatch:

permissions:
  contents: write   # only used to attach files to a Release when a v* tag is pushed

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r windows/requirements-windows.txt pytest

      - name: Run tests on Windows
        run: python -m pytest -q

      - name: Work out version
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') { $v = $env:GITHUB_REF_NAME.TrimStart('v') }
          else { $v = "1.0.$env:GITHUB_RUN_NUMBER" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build MailAgent.exe
        shell: pwsh
        run: ./windows/build.ps1 -SkipInstall -NoInstaller

      - name: Self-test the packaged exe
        shell: pwsh
        run: |
          $out = Join-Path $PWD "selftest.txt"
          $p = Start-Process -FilePath "dist\MailAgent\MailAgent.exe" -ArgumentList "desktop", "--selftest", "`"$out`"" -Wait -PassThru
          if (Test-Path $out) { Get-Content $out }
          if ($p.ExitCode -ne 0) { throw "Self-test failed with exit code $($p.ExitCode)" }

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DMyAppVersion=${{ steps.ver.outputs.version }}" windows/installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }

      - name: Portable ZIP
        shell: pwsh
        run: Compress-Archive -Path dist\MailAgent\* -DestinationPath "dist\MailAttachmentAgent-Portable-${{ steps.ver.outputs.version }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: MailAttachmentAgent-Windows-${{ steps.ver.outputs.version }}
          path: |
            dist/MailAttachmentAgent-Setup-*.exe
            dist/MailAttachmentAgent-Portable-*.zip
          if-no-files-found: error

      - name: Publish release (only for v* tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/MailAttachmentAgent-Setup-*.exe
            dist/MailAttachmentAgent-Portable-*.zip
